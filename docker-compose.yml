version: '3.8'

services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    depends_on:
      - chroma
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - api

  chroma:
    image: chromadb/chroma
    ports:
      - "8001:8000" # Exposing Chroma's API on a different port to avoid conflict with our API
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  chroma_data:
